[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grammarfixer"
dynamic = ["version"]
description = "Fix the grammar of any text box on Windows with one hotkey, powered by Gemini, OpenAI or a local Ollama model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["grammar", "spellcheck", "autocorrect", "llm", "gemini", "ollama", "windows", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pynput>=1.7.6",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6"]

[project.gui-scripts]
grammarfixer = "grammarfixer.app:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/grammarfixer"
Issues = "https://github.com/YOUR_USERNAME/grammarfixer/issues"

[tool.setuptools.dynamic]
version = { attr = "grammarfixer.__version__" }

[tool.setuptools.packages.find]
include = ["grammarfixer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
